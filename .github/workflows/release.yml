name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create release + upload assets
  id-token: write       # OIDC for keyless Sigstore signing
  attestations: write   # write build-provenance attestations

jobs:
  release:
    name: Build, sign, release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Sigstore-signed attestations for skill artifacts
        # Skills IL's signed_release check verifies attestations on the
        # actual skill files (SKILL.md, SKILL_HE.md, metadata.json) via
        # GitHub's Attestations API. Per agentskills.co.il/he/guides/
        # github-verification-checklist.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            SKILL.md
            SKILL_HE.md
            metadata.json

      - name: Build source tarball (release asset)
        run: |
          mkdir -p dist
          ARCHIVE="dist/venues-il-skill-${{ github.ref_name }}.tar.gz"
          git archive --format=tar.gz --prefix="venues-il-skill-${{ github.ref_name }}/" -o "$ARCHIVE" HEAD
          ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
